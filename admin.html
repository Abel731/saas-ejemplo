<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Control — Tío's Food Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Librería para generar Código QR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- SweetAlert2 para confirmaciones y alertas -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
  :root {
    --bg: #0C1014;
    --bg-card: #141A21;
    --bg-card-hover: #1C242E;
    --border: #232D39;
    --gold: #F59E0B;
    --green: #10B981;
    --red: #EF4444;
    --text: #F3F4F6;
    --text-muted: #9CA3AF;
    --radius: 10px;
    --font-heading: 'Outfit', sans-serif;
    --font-body: 'Plus Jakarta Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    padding-bottom: 60px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 800px; margin: 0 auto; padding: 0 16px; }

  header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 16px 0;
    position: sticky; top: 0; z-index: 20;
  }
  .header-inner {
    display: flex; justify-content: space-between; align-items: center;
  }
  .logo-admin {
    font-family: var(--font-heading); font-weight: 800; font-size: 1.1rem;
  }
  .logo-admin span { color: var(--gold); }

  .btn-qr-header {
    background: transparent; border: 1px solid var(--gold); color: var(--gold);
    padding: 6px 12px; border-radius: 50px; font-size: 0.8rem; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all .2s;
  }
  .btn-qr-header:hover { background: var(--gold); color: #000; }

  .stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin: 24px 0;
  }
  .stat-card {
    background: var(--bg-card); border: 1px solid var(--border);
    padding: 16px; border-radius: var(--radius); text-align: center;
  }
  .stat-card b { font-family: var(--font-heading); font-size: 1.5rem; display: block; color: var(--text); }
  .stat-card span { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

  .action-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }
  .action-bar h2 { font-family: var(--font-heading); font-size: 1.4rem; }

  .btn-add {
    background: var(--green); color: #000; font-family: var(--font-heading);
    font-weight: 700; font-size: 0.85rem; padding: 10px 18px; border-radius: 50px;
    border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }

  .admin-list { display: flex; flex-direction: column; gap: 12px; }

  .admin-item {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
    display: grid; grid-template-columns: 60px 1fr auto; gap: 14px; align-items: center;
  }
  .admin-item.out-of-stock { opacity: 0.5; filter: grayscale(0.6); }
  .item-img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
  .item-info h4 { font-family: var(--font-heading); font-size: 1rem; margin-bottom: 2px; }
  .item-info .price-tag { color: var(--green); font-weight: 700; font-size: 0.9rem; }
  .item-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

  .item-buttons { display: flex; gap: 6px; }
  .icon-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-muted);
    width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
    transition: all .2s;
  }
  .icon-btn:hover { border-color: var(--gold); color: var(--gold); }
  .icon-btn.delete:hover { border-color: var(--red); color: var(--red); }

  .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background-color: var(--border); transition: .3s; border-radius: 34px;
  }
  .slider:before {
    position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
    background-color: white; transition: .3s; border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--green); }
  input:checked + .slider:before { transform: translateX(22px); }
  .stock-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
  .stock-label.on { color: var(--green); }
  .stock-label.off { color: var(--red); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
    display: none; justify-content: center; align-items: center; z-index: 100; padding: 16px;
  }
  .modal-overlay.active { display: flex; }
  .modal-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); width: 100%; max-width: 450px; padding: 24px; text-align: left;
  }
  .modal-card h3 { font-family: var(--font-heading); font-size: 1.3rem; margin-bottom: 16px; }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 6px; font-family: var(--font-body); font-size: 0.9rem;
  }
  .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
  .btn-save { background: var(--gold); color: #000; font-weight: 700; border: none; padding: 10px 20px; border-radius: 6px; flex: 1; cursor: pointer; }
  .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 10px 20px; border-radius: 6px; cursor: pointer; }

  .qr-container {
    background: #fff; padding: 20px; border-radius: 8px;
    display: flex; justify-content: center; margin-bottom: 16px;
  }
  .qr-desc { color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 20px; }
</style>
</head>
<body>

<header>
  <div class="wrap header-inner">
    <div class="logo-admin">Panel <span>SaaS</span></div>
    <button class="btn-qr-header" onclick="openQrModal()">
      📱 Generar QR
    </button>
  </div>
</header>

<main class="wrap">
  <div class="stats-grid">
    <div class="stat-card">
      <b id="stat-total">0</b>
      <span>Total Platos</span>
    </div>
    <div class="stat-card">
      <b id="stat-active" style="color: var(--green)">0</b>
      <span>En Menú</span>
    </div>
    <div class="stat-card">
      <b id="stat-off" style="color: var(--red)">0</b>
      <span>Agotados</span>
    </div>
  </div>

  <div class="action-bar">
    <h2>Gestión de Carta</h2>
    <button class="btn-add" onclick="openProductModal()">+ Nuevo Producto</button>
  </div>

  <div class="admin-list" id="admin-list">
    <!-- Carga dinámica desde Supabase -->
  </div>
</main>

<!-- MODAL: AGREGAR PRODUCTO -->
<div class="modal-overlay" id="modal-product">
  <div class="modal-card">
    <h3>Agregar Producto</h3>
    <form id="product-form" onsubmit="saveProduct(event)">
      <div class="form-group">
        <label>Nombre del Producto</label>
        <input type="text" id="p-name" required placeholder="Ej: Burger Doble Cheddar">
      </div>
      <div class="form-group">
        <label>Precio (Guaraníes)</label>
        <input type="number" id="p-price" required placeholder="Ej: 35000">
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <select id="p-category" required>
          <option value="comidas">Comidas</option>
          <option value="bebidas">Coctelería / Bebidas</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nombre del archivo de imagen</label>
        <input type="text" id="p-image" required placeholder="Ej: imgHamb1.jpeg">
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <textarea id="p-desc" rows="2" placeholder="Ingredientes o detalle..."></textarea>
      </div>
      <div class="modal-buttons">
        <button type="button" class="btn-cancel" onclick="closeProductModal()">Cancelar</button>
        <button type="submit" class="btn-save">Guardar Producto</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL: CÓDIGO QR -->
<div class="modal-overlay" id="modal-qr">
  <div class="modal-card" style="text-align: center;">
    <h3>QR para Mesas</h3>
    <p class="qr-desc">Escaneá este código o guardá la imagen para imprimirla y colocarla en las mesas de Tío's Food Garden.</p>

    <div class="qr-container" id="qr-code"></div>

    <div class="form-group">
      <input type="text" id="qr-url-input" readonly value="https://tiosfood.mymenusaas.com">
    </div>

    <div class="modal-buttons">
      <button type="button" class="btn-cancel" onclick="closeQrModal()">Cerrar</button>
      <button type="button" class="btn-save" onclick="alert('Funcionalidad de descarga en desarrollo')">⬇️ Descargar QR</button>
    </div>
  </div>
</div>

<!-- SDK de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Nuestros archivos, en orden de dependencia -->
<script src="assets/js/config.js"></script>
<script src="assets/js/services/supabaseService.js"></script>
<script src="assets/js/components/productCard.js"></script>
<script src="assets/js/admin.js"></script>

<script>
  // ---------- GESTIÓN DEL CÓDIGO QR (sin cambios, no depende de Supabase) ----------
  let qrGenerated = false;
  const RESTAURANT_MENU_URL = 'https://tiosfood.mymenusaas.com';

  function openQrModal() {
    document.getElementById('modal-qr').classList.add('active');

    if (!qrGenerated) {
      document.getElementById("qr-url-input").value = RESTAURANT_MENU_URL;

      new QRCode(document.getElementById("qr-code"), {
        text: RESTAURANT_MENU_URL,
        width: 180,
        height: 180,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });
      qrGenerated = true;
    }
  }

  function closeQrModal() { document.getElementById('modal-qr').classList.remove('active'); }

  // ---------- MODAL DE PRODUCTO ----------
  let editingProductId = null;

  /**
   * @param {Object|null} product - si viene un producto, abre en modo edición
   *   precargado con sus datos. Si no, abre vacío en modo "Agregar".
   */
  function openProductModal(product = null) {
    const form = document.getElementById('product-form');
    const modalTitle = document.querySelector('#modal-product h3');

    if (product) {
      editingProductId = product.id;
      modalTitle.textContent = 'Editar Producto';
      document.getElementById('p-name').value = product.name;
      document.getElementById('p-price').value = product.price;
      document.getElementById('p-category').value = product.category;
      document.getElementById('p-image').value = product.image_url;
      document.getElementById('p-desc').value = product.description ?? '';
    } else {
      editingProductId = null;
      modalTitle.textContent = 'Agregar Producto';
      form.reset();
    }

    document.getElementById('modal-product').classList.add('active');
  }

  function closeProductModal() {
    document.getElementById('modal-product').classList.remove('active');
    document.getElementById('product-form').reset();
    editingProductId = null;
  }

  async function saveProduct(event) {
    event.preventDefault();

    const submitBtn = event.target.querySelector('.btn-save');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Guardando...';

    const productData = {
      name: document.getElementById('p-name').value.trim(),
      price: Number(document.getElementById('p-price').value),
      category: document.getElementById('p-category').value,
      image_url: document.getElementById('p-image').value.trim(),
      description: document.getElementById('p-desc').value.trim(),
    };

    let result;
    if (editingProductId) {
      result = await updateProduct(editingProductId, productData);
    } else {
      productData.restaurant_id = RESTAURANT_ID;
      productData.is_available = true;
      result = await addProduct(productData);
    }

    submitBtn.disabled = false;
    submitBtn.textContent = 'Guardar Producto';

    if (!result) {
      Swal.fire({
        title: 'No se pudo guardar',
        text: 'Revisá la consola para más detalles.',
        icon: 'error',
        background: '#141A21',
        color: '#F3F4F6',
        confirmButtonColor: '#F59E0B',
      });
      return;
    }

    const wasEditing = editingProductId !== null; // guardamos esto antes de cerrar el modal
    closeProductModal();
    await loadDashboard();

    Swal.fire({
      title: wasEditing ? 'Producto actualizado' : 'Producto agregado',
      icon: 'success',
      background: '#141A21',
      color: '#F3F4F6',
      confirmButtonColor: '#F59E0B',
      timer: 1500,
      timerProgressBar: true,
    });
  }
</script>

</body>
</html>
